title: Physical Design Wiki
description: A beginner's guide to ASIC physical design, from transistors to GDSII.
remote_theme: just-the-docs/just-the-docs

# ---------------------------------------------------------------------------
# Set `url` to your GitHub Pages domain and `baseurl` to "/<repo-name>".
# Example, for github.com/emma/pd-wiki served at emma.github.io/pd-wiki:
#   url: "https://emma.github.io"
#   baseurl: "/pd-wiki"
# ---------------------------------------------------------------------------
url: "https://sugar0ats.github.io"
baseurl: "/pd-wiki"

# Sidebar / navigation
nav_external_links:
  - title: Source repository
    url: https://github.com/
    hide_icon: false

# Full-text search across every page (built at deploy time, no server needed)
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# "Edit this page on GitHub" link under every page
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/sugar0ats/pd-wiki"
gh_edit_branch: "main"
gh_edit_view_mode: "edit"

heading_anchors: true
color_scheme: light

callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Watch out
    color: yellow
  interview:
    title: Interview angle
    color: purple

footer_content: >-
  Built from personal study notes. Sources are listed at the bottom of each page.

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

exclude:
  - image-manifest.json
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
